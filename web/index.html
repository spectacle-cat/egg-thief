<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The picture runs to every edge of a phone (under the notch too), and fingers never zoom the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Egg Thief</title>
    <meta name="description" content="You are a lizard. Collect eggs. Hide under bushes. Do not get eaten." />
    <meta name="theme-color" content="#342b0e" />
    <link rel="icon" href="./favicon.png" />
    <!-- Added to a phone's or tablet's home screen, the game opens full screen, on its side, like an app. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Egg Thief" />
    <link rel="preload" href="./fonts/Caroni-Regular.otf" as="font" type="font/otf" crossorigin />
    <style>
      /* Just enough for the first moment, before the game's own stylesheet arrives: dark earth, not a white flash. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #342b0e; color: #fff3c8; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
      #rotate { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot"><div id="boot-msg"><b>Egg Thief</b>Waking the lizard…</div></div>
    <!-- A phone held upright: there is no room for the game that way up. -->
    <div id="rotate"><div><i></i><b>Turn your phone sideways</b>The maps are wide.</div></div>
    <script>
      // Show a boot error on the page instead of a blank screen.
      window.__bootError = function (msg) {
        var el = document.getElementById('boot-msg');
        var boot = document.getElementById('boot');
        if (!el || !boot) return;
        boot.style.display = 'grid';
        boot.classList.remove('gone');
        el.innerHTML = '<b>The lizard is stuck</b>' + msg + '<br><small>The browser console (F12) has the details.</small>';
      };
      window.addEventListener('error', function (e) { if (!window.__booted) window.__bootError(e.message || String(e)); });
      window.addEventListener('unhandledrejection', function (e) { if (!window.__booted) window.__bootError((e.reason && e.reason.message) || String(e.reason)); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
