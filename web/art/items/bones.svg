<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Scattered bones: three ribs, one long bone and a couple of knuckle bits, sun-bleached. -->
  <defs>
    <!-- a long bone lying along +x from 0 to 70 -->
    <path id="long" d="M8 -4.5 L62 -3.5 C61 -10 70 -13 74 -8 C77 -4 75 0 72 0 C75 0 77 4 74 8 C70 13 61 10 62 3.5 L8 4.5 C9 10 0 13 -4 8 C-7 4 -5 0 -2 0 C-5 0 -7 -4 -4 -8 C0 -13 9 -10 8 -4.5 Z"/>
    <path id="longshade" d="M8 1 L62 1 L62 3.5 L8 4.5 Z M62 3.5 C61 10 70 13 74 8 C76 5 76 2 72 0 C72 5 66 6 62 3.5 Z M8 4.5 C9 10 0 13 -4 8 C-2 9 4 8 8 4.5 Z"/>
  </defs>

  <!-- ribs: thin tapering crescents -->
  <path d="M22 72 C46 34 106 28 140 58 C144 63 140 68 134 64 C104 44 58 50 34 80 C28 86 18 80 22 72 Z" fill="#f2e8c4"/>
  <path d="M34 80 C58 50 104 44 134 64 C130 66 126 64 122 62 C98 50 60 56 40 82 C38 84 35 82 34 80 Z" fill="#c3b178"/>

  <path d="M96 100 C124 86 160 94 176 122 C178 128 172 130 168 126 C154 106 124 100 102 110 C96 112 91 104 96 100 Z" fill="#f2e8c4"/>
  <path d="M102 110 C124 100 154 106 168 126 C164 126 161 123 158 120 C144 108 122 106 106 113 C104 113 102 112 102 110 Z" fill="#c3b178"/>

  <path d="M30 112 C30 146 58 174 96 174 C103 174 103 165 96 164 C66 162 44 140 41 110 C40 103 30 104 30 112 Z" fill="#f2e8c4"/>
  <path d="M96 174 C103 174 103 165 96 164 C66 162 44 140 41 110 C39 110 38 112 38 114 C42 144 64 168 94 170 C97 170 97 173 96 174 Z" fill="#c3b178"/>

  <!-- long bone -->
  <g transform="translate(112 142) rotate(24)">
    <use href="#long" fill="#f2e8c4"/>
    <use href="#longshade" fill="#c3b178"/>
  </g>
  <!-- small bone -->
  <g transform="translate(52 36) rotate(-18) scale(0.55)">
    <use href="#long" fill="#f2e8c4"/>
    <use href="#longshade" fill="#c3b178"/>
  </g>

  <!-- knuckle bits -->
  <path d="M150 62 l10 -4 l8 6 l-2 10 l-11 2 l-7 -6 Z" fill="#f2e8c4"/>
  <path d="M168 64 l-2 10 l-11 2 l-7 -6 l8 2 l8 -2 Z" fill="#c3b178"/>
  <path d="M66 126 l8 -2 l5 6 l-4 7 l-9 -1 l-3 -6 Z" fill="#f2e8c4"/>
  <path d="M79 130 l-4 7 l-9 -1 l-3 -6 l6 3 l6 -1 Z" fill="#c3b178"/>
</svg>
